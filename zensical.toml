[project]
site_name = "lineaccess"
site_description = "Find accesses to invasive pressure lines (blood draws, flushes, zeroing) in the pressure waveform."
use_directory_urls = false
repo_url = "https://github.com/meshlab/lineaccess"
repo_name = "meshlab/lineaccess"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
copyright = "© 2026 Andrew J. Goodwin, University of Sydney · MIT licence"

nav = [
  { "Home" = "index.md" },
  { "Get started" = "get-started.md" },
  { "How-to guides" = [{ "Find and label line accesses" = "how-to/find-accesses.md" }, { "Match lab samples to accesses" = "how-to/match-lab-samples.md" }, { "Tune the thresholds" = "how-to/tune-thresholds.md" }] },
  { "Concepts" = [{ "What a line access looks like" = "concepts/line-access.md" }] },
  { "API reference" = [{ "lineaccess" = "reference/index.md" }] },
]

[project.theme]
features = ["navigation.instant", "navigation.tabs", "navigation.sections", "navigation.top", "navigation.indexes", "toc.follow", "content.code.copy", "search.highlight", "search.suggest"]

[project.theme.icon]
repo = "fontawesome/brands/github"
logo = "lucide/droplet"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon-star"
toggle.name = "Switch to light mode"

[project.extra]
generator = false

[project.plugins.search]

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
show_root_heading = true
show_symbol_type_toc = true
show_if_no_docstring = false
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
members_order = "source"
filters = ["!^_"]

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.toc]
permalink = true
