[project]
name = "lineaccess"
version = "0.0.1"
description = "Find accesses to invasive pressure lines (blood draws, flushes, zeroing) in the pressure waveform"
license = "MIT"
authors = [{ name = "Andrew J. Goodwin" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["D"]          # docstrings: Google style, checked like TimeNet's
ignore = ["D105", "D107", "EXE002"]   # EXE002: the Windows-mounted files look executable

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.hatch.build.targets.wheel]
packages = ["lineaccess"]
